# Prometheus Configuration for Online Boutique
# Scrapes metrics from all microservices and monitoring components

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      - source_labels: [name]
        target_label: container

  # Scrape each Online Boutique service (assuming they expose /metrics on port 8080 or respective ports)
  - job_name: 'frontend'
    static_configs:
      - targets: ['frontend:8080']
  - job_name: 'cartservice'
    static_configs:
      - targets: ['cartservice:7070']
  - job_name: 'productcatalogservice'
    static_configs:
      - targets: ['productcatalogservice:3550']
  - job_name: 'currencyservice'
    static_configs:
      - targets: ['currencyservice:7000']
  - job_name: 'checkoutservice'
    static_configs:
      - targets: ['checkoutservice:5050']
  - job_name: 'paymentservice'
    static_configs:
      - targets: ['paymentservice:50051']
  - job_name: 'shippingservice'
    static_configs:
      - targets: ['shippingservice:50051']
  - job_name: 'recommendationservice'
    static_configs:
      - targets: ['recommendationservice:8080']
  - job_name: 'adservice'
    static_configs:
      - targets: ['adservice:9555']
  - job_name: 'emailservice'
    static_configs:
      - targets: ['emailservice:8080']
