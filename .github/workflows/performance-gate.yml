name: SPE Performance Quality Gate

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'scripts/**'
      - 'data/**'
      - 'tests/**'
      - 'api/**'
  pull_request:
    branches: [main, master]

jobs:
  performance-gate:
    name: Analytical QN Performance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib scipy pytest pytest-cov flask

      - name: Run SPE Test Suite
        run: pytest tests/ -v --tb=short

      - name: Execute CI Performance Quality Gate
        run: |
          python scripts/ci_performance_gate.py \
            --max-frontend-demand-ms 85.0 \
            --min-saturation-rps 11.5 \
            --max-nominal-rt-ms 250.0
        env:
          PYTHONIOENCODING: "utf-8"

      - name: Archive Performance Gate Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spe-performance-gate-report
          path: |
            results/ci_performance_gate_summary.md
            results/ci_performance_gate_report.json

      - name: Comment PR with Performance Gate Summary
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'results/ci_performance_gate_summary.md';
            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## :bar_chart: SPE Performance Gate Results\n\n' + summary
              });
            }

      - name: Run Queueing Network Model Solver
        run: python scripts/model/queueing_network.py

      - name: Validate Model Accuracy
        run: python scripts/validation/compare.py

      - name: Run HPA Policy Optimizer
        run: python scripts/model/hpa_policy_optimizer.py

      - name: Upload Generated Figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spe-validation-figures
          path: results/figures/*.png
